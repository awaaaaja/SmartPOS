name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  qr-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/qr_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/qr_web/package-lock.json
      - run: npm ci
      - run: npm run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Terapkan migrasi ke Postgres polos
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          chmod +x tests/integration/apply_migrations.sh
          tests/integration/apply_migrations.sh
