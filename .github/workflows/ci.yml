name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  qr-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/qr_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/qr_web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/e2e/package-lock.json
            apps/qr_web/package-lock.json
      # webServer Playwright menjalankan vite dev dari apps/qr_web,
      # jadi dependensinya wajib terpasang juga.
      - name: Pasang dependensi web QR
        working-directory: apps/qr_web
        run: npm ci
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: tests/e2e/test-results/
          retention-days: 7

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Terapkan migrasi ke Postgres polos
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          chmod +x tests/integration/apply_migrations.sh
          tests/integration/apply_migrations.sh
      - name: Refund dan mutasi stok aman terhadap retry
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_test
        run: python3 tests/integration/test_mutation_retry.py
      - name: Pengaturan usaha hanya bisa diubah operator
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_test
        run: python3 tests/integration/test_settings_edit.py
      - name: View agregat analitik deterministik (bukan ML)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_test
        run: python3 tests/integration/test_analytics_views.py
      - name: Rekomendasi non-ML (peringatan HPP + kalibrasi energi)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_test
        run: python3 tests/integration/test_recommendations.py
